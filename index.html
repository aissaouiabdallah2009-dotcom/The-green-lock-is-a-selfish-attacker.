<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GREENLOCK | Egoist Striker Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Teko:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- السكربت المصحح: التحقق من حالة التسجيل -->
    <script>
        (function() {
            var isRegistered = localStorage.getItem('greenlock_registered') === 'true';
            
            if (isRegistered) {
                // إذا كان مسجلاً مسبقاً -> توجيه لـ football.html
                window.location.replace('football.html');
            }
            // إذا لم يكن مسجلاً -> لا تفعل شيئاً، دعه يبقى في الصفحة للتسجيل
        })();
    </script>
    
    <style>
        :root {
            --neon-green: #00cc52;
            --neon-lime: #88cc00;
            --emerald-glow: #00883a;
            --dark-bg: #030d06;
            --panel-bg: rgba(4, 20, 10, 0.88);
            --panel-border: rgba(0, 204, 82, 0.3);
            --border-glow: #00cc52;
            --text-white: #e0e0e0;
            --text-dim: #7a9e84;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Share Tech Mono', sans-serif;
            background: var(--dark-bg);
            color: var(--text-white);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* ===== Background Grid & Aura ===== */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 204, 82, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 204, 82, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridPulse 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes gridPulse {
            0%, 100% { opacity: 0.15; transform: scale(1); }
            50% { opacity: 0.35; transform: scale(1.01); }
        }

        .aura-field {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0,204,82,0.06) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: auraBreathing 3s ease-in-out infinite alternate;
        }

        @keyframes auraBreathing {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.4; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.7; }
        }

        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 2;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--neon-lime);
            border-radius: 50%;
            box-shadow: 0 0 5px var(--neon-green);
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0) rotate(0deg); opacity: 0; }
            20% { opacity: 0.7; }
            80% { opacity: 0.5; }
            100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
        }

        .scanlines {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 204, 82, 0.02) 2px,
                rgba(0, 204, 82, 0.02) 4px
            );
            pointer-events: none;
            z-index: 10;
        }

        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 20%, rgba(2, 10, 4, 0.95) 100%);
            pointer-events: none;
            z-index: 5;
        }

        /* ===== Navbar ===== */
        .system-navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(3, 13, 6, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--neon-green);
            box-shadow: 0 0 15px rgba(0, 204, 82, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 6%;
            z-index: 999;
        }

        .nav-brand {
            font-family: 'Teko', 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 2rem;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(0, 204, 82, 0.5);
            letter-spacing: 3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-brand .tag {
            background: var(--neon-green);
            color: #000;
            font-family: 'Orbitron', monospace;
            font-size: 0.75rem;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 2px;
            letter-spacing: 1px;
        }

        /* ===== Main Container ===== */
        .system-container {
            position: relative;
            z-index: 20;
            width: 90%;
            max-width: 580px;
            margin-top: 70px;
            perspective: 1000px;
        }

        /* ===== Phase 1: Boot Sequence ===== */
        .boot-sequence {
            text-align: center;
            padding: 40px 20px;
            background: rgba(3, 15, 7, 0.7);
            border: 1px solid rgba(0, 204, 82, 0.2);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
        }

        .system-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--neon-green);
            text-shadow: 0 0 12px var(--neon-green);
            letter-spacing: 10px;
            margin-bottom: 5px;
            opacity: 0;
            animation: logoReveal 1.8s ease-out 0.3s forwards;
        }

        .system-subtitle {
            font-family: 'Orbitron', monospace;
            font-size: 0.95rem;
            color: #ffffff;
            letter-spacing: 5px;
            opacity: 0;
            animation: fadeIn 1s ease-out 1.2s forwards;
        }

        .loading-container {
            margin-top: 35px;
            opacity: 0;
            animation: fadeIn 1s ease-out 1.5s forwards;
        }

        .loading-label {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.85rem;
            color: var(--neon-green);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .loading-bar-outer {
            width: 100%;
            height: 4px;
            background: rgba(0, 204, 82, 0.15);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(0, 204, 82, 0.3);
        }

        .loading-bar-inner {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--emerald-glow), var(--neon-green), var(--neon-lime));
            box-shadow: 0 0 8px var(--neon-green);
            animation: loadProgress 3.5s ease-in-out 1.8s forwards;
        }

        .loading-percent {
            font-family: 'Orbitron', monospace;
            font-size: 1rem;
            color: var(--neon-lime);
            font-weight: 700;
        }

        .boot-text {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.8rem;
            color: #6edb8c;
            margin-top: 25px;
            min-height: 100px;
            text-align: left;
            direction: ltr;
            line-height: 1.9;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-left: 2px solid var(--neon-green);
        }

        /* ===== Phase 2: Egoist Gate Form ===== */
        .gate-container {
            display: none;
            position: relative;
            padding: 10px;
            animation: fadeIn 1s ease-out forwards;
        }

        .gate-frame {
            position: relative;
            border: 1px solid var(--panel-border);
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            padding: 40px 35px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 25px), calc(100% - 25px) 100%, 0 100%);
        }

        .corner {
            position: absolute;
            width: 18px;
            height: 18px;
            border: 1px solid var(--neon-green);
        }
        .corner-tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .corner-tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
        .corner-br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

        .gate-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .gate-badge {
            display: inline-block;
            font-family: 'Orbitron', monospace;
            font-size: 0.8rem;
            color: var(--neon-lime);
            background: rgba(0, 204, 82, 0.08);
            border: 1px solid var(--neon-green);
            padding: 4px 14px;
            margin-bottom: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .gate-title {
            font-family: 'Teko', 'Orbitron', sans-serif;
            font-size: 2.8rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 3px;
            line-height: 1;
            text-shadow: 0 0 10px rgba(0, 204, 82, 0.3);
            text-transform: uppercase;
        }

        .gate-subtitle {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.85rem;
            color: var(--neon-green);
            letter-spacing: 3px;
            margin-top: 5px;
        }

        .player-form {
            margin-top: 25px;
        }

        .input-group {
            margin-bottom: 25px;
            position: relative;
        }

        .input-group label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .input-group label .req {
            color: var(--neon-lime);
        }

        .neon-input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(0, 204, 82, 0.3);
            color: var(--neon-green);
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.05rem;
            font-weight: 700;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
        }

        .neon-input::placeholder {
            color: rgba(0, 204, 82, 0.3);
        }

        .neon-input:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 15px rgba(0, 204, 82, 0.4), inset 0 0 10px rgba(0, 204, 82, 0.2);
            background: rgba(0, 20, 5, 0.85);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: var(--neon-green);
            color: var(--dark-bg);
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 900;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 204, 82, 0.4);
            margin-top: 10px;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
        }

        .submit-btn:hover {
            background: #ffffff;
            box-shadow: 0 0 25px #ffffff;
            color: #000;
        }

        /* ===== Animations ===== */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes logoReveal {
            from { opacity: 0; transform: scale(1.2); text-shadow: 0 0 0px var(--neon-green); }
            to { opacity: 1; transform: scale(1); text-shadow: 0 0 25px var(--neon-green); }
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            30% { width: 45%; }
            60% { width: 75%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>
    <!-- المؤثرات البصرية الخلفية -->
    <div class="bg-grid"></div>
    <div class="aura-field"></div>
    <div class="particles" id="particles-container"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- الشريط العلوي -->
    <header class="system-navbar">
        <div class="nav-brand">
            GREENLOCK <span class="tag">V1.0</span>
        </div>
    </header>

    <main class="system-container">
        <!-- المرحلة 1: شاشة الإقلاع الوهمية -->
        <div class="boot-sequence" id="boot-phase">
            <div class="system-logo">SYSTEM BOOT</div>
            <div class="system-subtitle">EGOIST PROTOCOL INITIALIZING...</div>
            
            <div class="loading-container">
                <div class="loading-label">
                    <span>Establishing Neural Link</span>
                    <span class="loading-percent" id="loading-text">0%</span>
                </div>
                <div class="loading-bar-outer">
                    <div class="loading-bar-inner"></div>
                </div>
            </div>
            
            <div class="boot-text" id="boot-console">
                > System check: OK<br>
                > Loading Striker Algorithms...<br>
            </div>
        </div>

        <!-- المرحلة 2: نموذج الدخول والتسجيل -->
        <div class="gate-container" id="form-phase">
            <div class="gate-frame">
                <div class="corner corner-tl"></div>
                <div class="corner corner-tr"></div>
                <div class="corner corner-bl"></div>
                <div class="corner corner-br"></div>
                
                <div class="gate-header">
                    <div class="gate-badge">Authentication Required</div>
                    <h1 class="gate-title">ENTER GREENLOCK</h1>
                    <div class="gate-subtitle">Prove your ego on the pitch</div>
                </div>

                <form class="player-form" id="registration-form" onsubmit="initializePlayer(event)">
                    <div class="input-group">
                        <label for="player-name">
                            <span>STRIKER NAME / ALIAS</span>
                            <span class="req">[REQUIRED]</span>
                        </label>
                        <input type="text" id="player-name" class="neon-input" placeholder="e.g. Isagi Yoichi" required autocomplete="off">
                    </div>
                    
                    <div class="input-group">
                        <label for="player-title">
                            <span>PRIMARY WEAPON / STYLE</span>
                            <span class="req">[REQUIRED]</span>
                        </label>
                        <input type="text" id="player-title" class="neon-input" placeholder="e.g. Direct Shot, Speed..." required autocomplete="off">
                    </div>

                    <button type="submit" class="submit-btn">Initialize Egoist Data</button>
                </form>
            </div>
        </div>
    </main>

    <!-- سكربت التحكم بالأنيميشن والتسجيل -->
    <script>
        // 1. إنشاء الجزيئات العائمة في الخلفية
        function createParticles() {
            const container = document.getElementById('particles-container');
            for (let i = 0; i < 30; i++) {
                let particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
                particle.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(particle);
            }
        }
        createParticles();

        // 2. محاكاة شاشة الإقلاع ثم إظهار النموذج
        document.addEventListener("DOMContentLoaded", function() {
            const percentText = document.getElementById('loading-text');
            const bootConsole = document.getElementById('boot-console');
            
            let progress = 0;
            const bootInterval = setInterval(() => {
                progress += Math.floor(Math.random() * 5) + 2;
                if(progress > 100) progress = 100;
                percentText.innerText = progress + '%';
                
                if (progress === 45) bootConsole.innerHTML += "> Calibrating Ego parameters...<br>";
                if (progress === 75) bootConsole.innerHTML += "> Syncing with global database...<br>";
                
                if(progress === 100) {
                    clearInterval(bootInterval);
                    bootConsole.innerHTML += "> Link Established. Access Granted.<br>";
                    
                    // إخفاء شاشة الإقلاع وعرض الفورم بعد ثانية واحدة
                    setTimeout(() => {
                        document.getElementById('boot-phase').style.display = 'none';
                        document.getElementById('form-phase').style.display = 'block';
                    }, 1200);
                }
            }, 100);
        });

        // 3. وظيفة التسجيل وحفظ البيانات ثم الانتقال للصفحة الرئيسية
        function initializePlayer(event) {
            event.preventDefault(); // منع إعادة تحميل الصفحة
            
            const name = document.getElementById('player-name').value.trim();
            const title = document.getElementById('player-title').value.trim();

            if(name !== '' && title !== '') {
                // حفظ البيانات في الذاكرة المحلية (LocalStorage) بنفس المفاتيح الموجودة في football.html
                const playerData = {
                    realName: name,
                    footballTitle: title
                };
                
                localStorage.setItem('greenlock_player_data', JSON.stringify(playerData));
                localStorage.setItem('greenlock_registered', 'true');
                
                // تغيير النص وتوجيه المستخدم
                const btn = document.querySelector('.submit-btn');
                btn.innerHTML = "SYNCING... PREPARE TO ENTER";
                btn.style.background = "#fff";
                
                setTimeout(() => {
                    window.location.href = 'football.html';
                }, 800);
            }
        }
    </script>
</body>
</html>
